name: taskflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: taskflow-backend:local
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5005
      FRONTEND_URL: http://localhost:5175
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: taskflow
      PGUSER: taskflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:5005:5005"
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5005/api/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    image: taskflow-frontend:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5175:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data: